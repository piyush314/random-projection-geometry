name: theorem checks
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run the machine-checked theorem suite
        run: python verification/run_all.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verification-results
          path: |
            verification/results.md
            verification/results.json
