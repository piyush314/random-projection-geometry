name: Bug report
description: Report an incorrect result, crash, or reproducibility failure
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: Include dimensions, inputs, command, and full error.
    validations: {required: true}
  - type: textarea
    attributes:
      label: Expected mathematical or software behavior
    validations: {required: true}
  - type: input
    attributes: {label: rpgeom version or commit}
    validations: {required: true}
  - type: input
    attributes: {label: Python, NumPy, and SciPy versions}
    validations: {required: true}
